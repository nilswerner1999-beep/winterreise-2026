<style>
/* VOICE everyday travel companion, calm and exact
   IDEA a travel wallet: route map up top, boarding passes and hostel vouchers below
   PICTURE stylised map of Britain with the route drawn as flight arcs and rail line
   COLOUR saltire blue sea band, white paper, ink, thistle red accent for pins and open items
   TYPE Barlow Condensed (departure board) + Inter
   LAYOUT laptop: map left, next-leg + checklist right; phone: title, map, next leg, days */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1620);--ink:light-dark(#13202b,#e8eef3);--mute:light-dark(#566673,#9fb0bd);--sea:light-dark(#0b5cad,#0a2f52);--land:light-dark(#eef3f6,#1a2a37);--land2:light-dark(#dfe7ec,#243747);--card:light-dark(#f4f7f9,#13212d);--line:light-dark(#d5dee5,#2a3b49);--acc:light-dark(#d7263d,#ff5a6e);--ok:light-dark(#1d7a4a,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em;line-height:1.05;margin:0}
.top{background:var(--sea);color:#fff;padding:20px max(5vw,16px) 0}
.top h1{font-size:clamp(34px,6vw,52px);text-wrap:balance}
.top p{margin:4px 0 0;opacity:.9}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start;max-width:1240px;margin:0 auto}
.map{background:var(--sea);padding:8px 0 0}
.map svg{width:100%;height:auto;display:block;max-height:78vh}
.land{fill:var(--land);stroke:color-mix(in srgb,var(--land) 70%,#000);stroke-width:2}
.arc{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round}
.rail{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round}
.pin{fill:var(--acc);stroke:#fff;stroke-width:4}
.pin.ap{fill:#fff;stroke:var(--sea);stroke-width:5}
.lbl{font:600 30px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:8px}
.lbl.w{fill:#fff;stroke:var(--sea)}
.lbl small,.sub{font-size:24px;font-weight:500}
.side{padding:4px 0 24px;color:#fff}
.next{background:var(--bg);color:var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.next .k{font-size:14px;color:var(--mute)}
.next .big{font-size:clamp(40px,7vw,60px);color:var(--acc)}
.next .what{font-weight:600;margin-top:4px}
.stays{display:grid;gap:8px}
.stay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px}
.stay b{font-family:"Barlow Condensed",sans-serif;font-size:22px;white-space:nowrap}
.stay span{font-size:15px}
main{max-width:1240px;margin:0 auto;padding:28px max(5vw,16px) 48px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:36px;align-items:start}
h2{font-size:34px;margin:0 0 14px}
.day{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.day.now{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:12px;padding-inline:10px}
.date .big{font-size:40px}
.date .wd{font-size:14px;color:var(--mute)}
.ev{margin-bottom:10px}
.pass{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.pass:after{content:"";position:absolute;right:30%;top:10px;bottom:10px;border-right:2px dashed var(--line)}
.pass .ap{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;line-height:1}
.pass .t{font-size:15px;white-space:nowrap}
.pass .mid{text-align:center;font-size:13px;color:var(--mute)}
.pass .mid svg{width:34px;height:20px;display:block;margin:0 auto;fill:var(--acc)}
.pass .r{text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute);margin-top:6px}
.meta strong{color:var(--ink);font-weight:600}
.stayc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sea);border-radius:12px;padding:12px 14px}
.stayc h3{font-size:24px}
.stayc p{margin:4px 0 0;font-size:15px}
.warn{border-left-color:var(--acc)}
.open{border:2px dashed var(--acc);border-radius:12px;padding:10px 14px;font-size:15px}
.open b{color:var(--acc)}
.copy{font:600 14px Inter,sans-serif;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;min-height:32px;cursor:pointer}
.copy:focus-visible,.chk input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a{color:inherit}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ok)}
.chk input:checked+span{text-decoration:line-through;color:var(--mute)}
.chk small{display:block;color:var(--mute);font-size:13px}
.count{font-size:15px;color:var(--mute);margin:-8px 0 12px}
.aside{position:sticky;top:16px}
.prog{margin-top:4px;border-left:2px solid var(--line);padding-left:12px}
.act{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0}
.at{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;white-space:nowrap}
.ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.an{font-weight:600}
.an a{text-decoration-color:var(--line);text-underline-offset:3px}
.ad{font-size:15px;color:var(--mute)}
.pr{font-size:13px;font-weight:600;white-space:nowrap}
.tag{font-size:13px;font-weight:600;padding:1px 8px;border-radius:99px;color:#fff;background:var(--sea)}
.tag.mus{background:#7a3e9d}.tag.sight{background:#0b5cad}.tag.walk{background:#2d7d46}.tag.food{background:#b35c00}.tag.night{background:#33415c}.tag.music{background:var(--acc)}.tag.tour{background:#5c6b73}.tag.photo{background:#c2185b}.tag.trans{background:#1f2933}
.install{margin-top:10px;font-size:14px}
.foot{font-size:13px;color:var(--mute);margin-top:24px}
@media(max-width:900px){.hero,.cols{grid-template-columns:minmax(0,1fr)}.aside{position:static}.side{padding-top:0}}
@media(max-width:600px){.day{grid-template-columns:62px minmax(0,1fr);gap:8px}.date .big{font-size:27px}.pass .ap{font-size:28px}.pass:after{display:none}}
@media(prefers-reduced-motion:no-preference){.arc{animation:fly 2.4s linear infinite}@keyframes fly{to{stroke-dashoffset:-32}}}
</style>
</head>
