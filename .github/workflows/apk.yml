name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Web-App in APK kopieren
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json icon.svg icon-192.png icon-512.png android/app/src/main/assets/www/
      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Winterreise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Winterreise-APK
          path: Winterreise.apk
      - name: Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Winterreise APK
          body: Neueste Version der Reise-App. Winterreise.apk herunterladen und installieren.
          prerelease: false
          make_latest: true
          files: Winterreise.apk
